name: Build & Release ReelGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ReelGuard.apk
          elif [ -f "ReelGuard_Android_Project/settings.gradle.kts" ]; then
            cd ReelGuard_Android_Project && gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../ReelGuard.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelGuard-debug-apk
          path: ReelGuard.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ReelGuard v1.0.${{ github.run_number }} (Android APK)
          body: |
            ### ReelGuard Android APK Release
            Download **`ReelGuard.apk`** below under **Assets** and tap it on your Android phone to install.
          files: ReelGuard.apk
          prerelease: false
